[tool.poetry]
name = "codoc-in-md"
version = "0.1.0"
description = ""
authors = []
packages = [{include = "codoc_in_md"}]

[tool.poetry.dependencies]
# Developed on 3.11 (see AGENTS.md), the Python of the re_ddns App Store image (python:3.11);
# also installs and runs on 3.15.
python = ">=3.11,<3.16"
# DocumentModel is an rx.Model; Reflex 0.10 installs SQLModel, SQLAlchemy and Alembic only with the db extra.
reflex = {version = "0.10.0", extras = ["db"]}
reflex-monaco = "*"
pygments = ">=2.17"
emoji = ">=2.10.0"
markdown = "^3.6"
weasyprint = "^62.0"
pydyf = "0.11.0"
reflex-ddns-auth = {path = "../reflex_ddns_auth", develop = true}
PyJWT = ">=2.8"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
playwright = "^1.42.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
